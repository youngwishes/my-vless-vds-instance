[project]
name = "vless-vds-instance"
version = "0.1.0"
description = "VLESS node agent managed by the central subscription backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "grpcio==1.74.0",
    "protobuf==6.31.1",
    "pydantic-settings==2.10.1",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
