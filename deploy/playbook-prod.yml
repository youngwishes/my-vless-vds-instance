---
- name: Deploy reviewed VLESS agent revision to production
  hosts: vless_prod
  become: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require an immutable deployment revision
      ansible.builtin.assert:
        that:
          - deploy_revision is defined
          - deploy_revision is match('^[0-9a-f]{40}$')
        fail_msg: deploy_revision must be a full 40-character lowercase Git SHA
  roles:
    - role: vless_agent
