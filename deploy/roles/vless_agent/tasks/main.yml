---
- name: Validate non-secret deployment inputs
  ansible.builtin.assert:
    that:
      - deploy_revision is match('^[0-9a-f]{40}$')
      - vless_agent_repo_url | length > 0
      - vless_agent_domain | length > 0
      - vless_agent_management_port | int != vless_agent_public_port | int
      - vless_agent_central_backend_ipv4_allowlist | length > 0
      - vless_agent_compose_project_name is match('^[a-z0-9][a-z0-9_-]*$')
      - vless_agent_compose_project_name | length <= 63
      - vless_agent_snapshot_volume == vless_agent_compose_project_name ~ '_agent-snapshot'
      - vless_agent_snapshot_backup_retention | int > 0
      - vless_agent_reality_target | length > 0
      - vless_agent_reality_server_name | length > 0
      - vless_agent_reality_short_ids | length > 0
    fail_msg: Required immutable deployment, TLS, firewall, and REALITY inputs are missing

- name: Validate every central backend IPv4 source
  ansible.builtin.assert:
    that:
      - item | vless_agent_unicast_ipv4
    fail_msg: Management allowlist entries must be explicit unicast IPv4 addresses
  loop: "{{ vless_agent_central_backend_ipv4_allowlist }}"

- name: Resolve per-node Vault values
  ansible.builtin.set_fact:
    vless_agent_node_tokens: "{{ vault_vless_agent_tokens[inventory_hostname] }}"
    vless_agent_token_current: "{{ vault_vless_agent_tokens[inventory_hostname].current }}"
    vless_agent_token_next: "{{ vault_vless_agent_tokens[inventory_hostname].next | default('') }}"
    vless_agent_reality_private_key: "{{ vault_reality_private_keys[inventory_hostname] }}"
  no_log: true

- name: Validate per-node Vault values and fleet token uniqueness
  ansible.builtin.assert:
    that:
      - vless_agent_token_current | length >= 32
      - vless_agent_token_next | length == 0 or vless_agent_token_next | length >= 32
      - vless_agent_token_next | length == 0 or vless_agent_token_next != vless_agent_token_current
      - vless_agent_reality_private_key | length > 0
      - vault_vless_agent_tokens | vless_agent_all_node_tokens_unique
    fail_msg: Each node requires unique current credentials and an optional distinct next token
  no_log: true

- name: Install explicit runtime packages without auto-starting nginx
  ansible.builtin.apt:
    name: "{{ vless_agent_required_packages }}"
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Preflight Docker Compose runtime
  ansible.builtin.command:
    argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", version]
  changed_when: false

- name: Remove packaged nginx default listener
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Ensure private runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/vless-agent, owner: root, group: root, mode: "0700"}
    - {path: /etc/vless-agent/secrets, owner: "65532", group: "65532", mode: "0700"}
    - {path: "{{ vless_agent_snapshot_backup_dir }}", owner: root, group: root, mode: "0700"}

- name: Render node REALITY key file
  ansible.builtin.copy:
    content: "{{ vless_agent_reality_private_key }}"
    dest: "{{ vless_agent_reality_key_path }}"
    owner: "65532"
    group: "65532"
    mode: "0600"
  no_log: true

- name: Inspect TLS certificate
  ansible.builtin.stat:
    path: "{{ vless_agent_tls_certificate_path }}"
  register: vless_agent_tls_cert_stat

- name: Inspect TLS private key
  ansible.builtin.stat:
    path: "{{ vless_agent_tls_private_key_path }}"
  register: vless_agent_tls_key_stat
  no_log: true

- name: Require safe out-of-band TLS files
  ansible.builtin.assert:
    that:
      - vless_agent_tls_cert_stat.stat.exists
      - vless_agent_tls_cert_stat.stat.isreg
      - not vless_agent_tls_cert_stat.stat.islnk
      - vless_agent_tls_cert_stat.stat.pw_name == 'root'
      - vless_agent_tls_cert_stat.stat.mode is match('^0[0-7][0145][0145]$')
      - vless_agent_tls_key_stat.stat.exists
      - vless_agent_tls_key_stat.stat.isreg
      - not vless_agent_tls_key_stat.stat.islnk
      - vless_agent_tls_key_stat.stat.mode in ['0400', '0600']
      - vless_agent_tls_key_stat.stat.pw_name == 'root'
    fail_msg: TLS certificate/key must be regular out-of-band files and the key must be private
  no_log: true

- name: Check TLS certificate validity window with openssl x509 -checkend
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "{{ vless_agent_tls_minimum_validity_seconds }}"
      - -noout
      - -in
      - "{{ vless_agent_tls_certificate_path }}"
  changed_when: false

- name: Check TLS certificate hostname with openssl x509 -checkhost
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkhost
      - "{{ vless_agent_domain }}"
      - -noout
      - -in
      - "{{ vless_agent_tls_certificate_path }}"
  changed_when: false

- name: Certificate and private key must match
  ansible.builtin.shell: |
    set -eu
    cert_pub="$(mktemp)"
    key_pub="$(mktemp)"
    trap 'rm -f "$cert_pub" "$key_pub"' EXIT
    openssl x509 -in "{{ vless_agent_tls_certificate_path }}" -pubkey -noout >"$cert_pub"
    openssl pkey -in "{{ vless_agent_tls_private_key_path }}" -pubout >"$key_pub"
    cmp -s "$cert_pub" "$key_pub"
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Install management firewall script
  ansible.builtin.template:
    src: vless-agent-firewall.sh.j2
    dest: /usr/local/sbin/vless-agent-firewall
    owner: root
    group: root
    mode: "0700"
  register: vless_agent_firewall_script

- name: Install management firewall unit
  ansible.builtin.template:
    src: vless-agent-firewall.service.j2
    dest: /etc/systemd/system/vless-agent-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: vless_agent_firewall_unit

- name: Enable management firewall before external TLS listener
  ansible.builtin.systemd_service:
    name: vless-agent-firewall.service
    enabled: true
    state: started
    daemon_reload: true

- name: Reload management firewall atomically
  ansible.builtin.systemd_service:
    name: vless-agent-firewall.service
    state: reloaded
  when: vless_agent_firewall_script.changed or vless_agent_firewall_unit.changed

- name: Inspect existing checkout
  ansible.builtin.stat:
    path: "{{ vless_agent_deploy_dir }}/.git"
  register: vless_agent_checkout

- name: Check existing checkout cleanliness with git status --porcelain
  ansible.builtin.command:
    argv: [git, status, --porcelain]
    chdir: "{{ vless_agent_deploy_dir }}"
  register: vless_checkout_status
  changed_when: false
  when: vless_agent_checkout.stat.exists

- name: Reject a dirty existing checkout
  ansible.builtin.assert:
    that:
      - vless_checkout_status.stdout | length == 0
    fail_msg: Existing deployment checkout is dirty; refusing to overwrite operator changes
  when: vless_agent_checkout.stat.exists

- name: Capture previous exact Git revision
  ansible.builtin.command:
    argv: [git, rev-parse, HEAD]
    chdir: "{{ vless_agent_deploy_dir }}"
  register: vless_agent_previous_revision_command
  changed_when: false
  when: vless_agent_checkout.stat.exists

- name: Capture previous exact Git SHA and Compose state
  ansible.builtin.set_fact:
    vless_previous_revision: "{{ vless_agent_previous_revision_command.stdout | default('') }}"
    vless_agent_active_revision: "{{ deploy_revision }}"

- name: Capture previous Compose state
  ansible.builtin.command:
    argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", ps, --format, json]
    chdir: "{{ vless_agent_deploy_dir }}"
  register: vless_previous_compose_state
  changed_when: false
  failed_when: false
  when: vless_agent_checkout.stat.exists
  no_log: true

- name: Inspect named agent-snapshot volume before changing code
  ansible.builtin.command:
    argv: [docker, volume, inspect, --format, "{{ '{{ .Mountpoint }}' }}", "{{ vless_agent_snapshot_volume }}"]
  register: vless_agent_snapshot_mount
  changed_when: false
  failed_when: false
  no_log: true

- name: Inspect current durable snapshot
  ansible.builtin.stat:
    path: "{{ vless_agent_snapshot_mount.stdout }}/snapshot.json"
  register: vless_agent_snapshot_stat
  when: vless_agent_snapshot_mount.rc == 0
  no_log: true

- name: Back up current snapshot privately
  ansible.builtin.copy:
    src: "{{ vless_agent_snapshot_mount.stdout }}/snapshot.json"
    dest: "{{ vless_agent_snapshot_backup_dir }}/snapshot-{{ ansible_date_time.iso8601_basic_short }}.json"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - vless_agent_snapshot_mount.rc == 0
    - vless_agent_snapshot_stat.stat.exists | default(false)
  no_log: true

- name: Find private snapshot backups for bounded retention
  ansible.builtin.find:
    paths: "{{ vless_agent_snapshot_backup_dir }}"
    patterns: snapshot-*.json
    file_type: file
    age_stamp: mtime
  register: vless_agent_snapshot_backups
  no_log: true

- name: Remove snapshot backups beyond retention
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (vless_agent_snapshot_backups.files | sort(attribute='mtime', reverse=true))[vless_agent_snapshot_backup_retention | int:] }}"
  no_log: true

- name: Deploy exact revision with compatible automatic rollback
  block:
    - name: Checkout only the requested exact revision
      ansible.builtin.git:
        repo: "{{ vless_agent_repo_url }}"
        dest: "{{ vless_agent_deploy_dir }}"
        version: "{{ deploy_revision }}"
        update: true
        force: false

    - name: Verify checked out revision is exact
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ vless_agent_deploy_dir }}"
      register: vless_agent_checked_out_revision
      changed_when: false
      failed_when: vless_agent_checked_out_revision.stdout != deploy_revision

    - name: Render private agent environment
      ansible.builtin.template:
        src: agent.env.j2
        dest: "{{ vless_agent_env_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Validate exact production Compose configuration
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", --env-file, "{{ vless_agent_env_path }}", -f, docker-compose.yml, config, --quiet]
        chdir: "{{ vless_agent_deploy_dir }}"
      changed_when: false
      no_log: true

    - name: Read rendered Compose structure without exposing environment
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", --env-file, "{{ vless_agent_env_path }}", -f, docker-compose.yml, config, --format, json]
        chdir: "{{ vless_agent_deploy_dir }}"
      register: vless_agent_compose_json
      changed_when: false
      no_log: true

    - name: Parse rendered Compose structure privately
      ansible.builtin.set_fact:
        vless_agent_compose_config: "{{ vless_agent_compose_json.stdout | from_json }}"
      no_log: true

    - name: Require immutable runtime and durable deployment boundaries
      ansible.builtin.assert:
        that:
          - vless_agent_compose_config.services.xray.image == 'ghcr.io/xtls/xray-core@sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f'
          - vless_agent_compose_config.services.agent.ports | length == 1
          - vless_agent_compose_config.services.agent.ports[0].host_ip == '127.0.0.1'
          - vless_agent_compose_config.services.agent.ports[0].target | int == 8000
          - "'agent-snapshot' in vless_agent_compose_config.volumes"
        fail_msg: Rendered Compose must retain exact Xray digest, loopback API, and snapshot volume
      no_log: true

    - name: Replace services while preserving named snapshot volume
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", --env-file, "{{ vless_agent_env_path }}", -f, docker-compose.yml, up, -d, --build, --remove-orphans]
        chdir: "{{ vless_agent_deploy_dir }}"
      no_log: true

    - name: Install nginx TLS virtual host
      ansible.builtin.template:
        src: vless-agent.nginx.conf.j2
        dest: /etc/nginx/sites-enabled/vless-agent.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Start nginx after firewall is active
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

    - name: Reload nginx TLS configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Verify authenticated HTTPS health
      ansible.builtin.uri:
        url: "https://{{ vless_agent_domain }}:{{ vless_agent_management_port }}/api/v1/health"
        method: GET
        validate_certs: true
        use_proxy: false
        return_content: true
        headers:
          Authorization: Bearer {{ vless_agent_token_current }}
          X-Agent-Contract-Version: v1
      register: vless_agent_health
      retries: 12
      delay: 5
      until:
        - vless_agent_health.status == 200
        - vless_agent_health.json.agent_sha == vless_agent_active_revision
        - vless_agent_health.json.contract_version == 'v1'
        - vless_agent_health.json.schema_version == '1.0'
        - vless_agent_health.json.xray_version == '26.7.11'
        - vless_agent_health.json.xray_image_digest == 'sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f'
        - vless_agent_health.json.readiness in ['READY', 'RECOVERY_READY', 'NOT_READY']
      no_log: true

  rescue:
    - name: Determine whether compatible automatic rollback is possible
      ansible.builtin.set_fact:
        vless_agent_can_rollback: >-
          {{ vless_previous_revision is match('^[0-9a-f]{40}$') and
             vless_previous_revision in vless_agent_compatible_rollback_revisions }}

    - name: Explain first-install or incompatible rollback refusal
      ansible.builtin.fail:
        msg: >-
          No automatic rollback is possible on a first install or when the previous
          exact SHA is absent from vless_agent_compatible_rollback_revisions. The
          snapshot and its private backup were preserved; manual schema downgrade is forbidden.
      when: not vless_agent_can_rollback

    - name: Restore compatible previous exact checkout
      ansible.builtin.git:
        repo: "{{ vless_agent_repo_url }}"
        dest: "{{ vless_agent_deploy_dir }}"
        version: "{{ vless_previous_revision }}"
        update: true
        force: false
      when: vless_agent_can_rollback

    - name: Select previous revision for rollback environment
      ansible.builtin.set_fact:
        vless_agent_active_revision: "{{ vless_previous_revision }}"
      when: vless_agent_can_rollback

    - name: Restore private environment for previous revision
      ansible.builtin.template:
        src: agent.env.j2
        dest: "{{ vless_agent_env_path }}"
        owner: root
        group: root
        mode: "0600"
      when: vless_agent_can_rollback
      no_log: true

    - name: Restart compatible previous revision using the same snapshot volume
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ vless_agent_compose_project_name }}", --env-file, "{{ vless_agent_env_path }}", -f, docker-compose.yml, up, -d, --build, --remove-orphans]
        chdir: "{{ vless_agent_deploy_dir }}"
      when: vless_agent_can_rollback
      no_log: true

    - name: Verify rolled back HTTPS health
      ansible.builtin.uri:
        url: "https://{{ vless_agent_domain }}:{{ vless_agent_management_port }}/api/v1/health"
        method: GET
        validate_certs: true
        use_proxy: false
        return_content: true
        headers:
          Authorization: Bearer {{ vless_agent_token_current }}
          X-Agent-Contract-Version: v1
      register: vless_agent_rollback_health
      retries: 12
      delay: 5
      until:
        - vless_agent_rollback_health.status == 200
        - vless_agent_rollback_health.json.agent_sha == vless_agent_active_revision
        - vless_agent_rollback_health.json.contract_version == 'v1'
        - vless_agent_rollback_health.json.schema_version == '1.0'
        - vless_agent_rollback_health.json.xray_version == '26.7.11'
        - vless_agent_rollback_health.json.xray_image_digest == 'sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f'
        - vless_agent_rollback_health.json.readiness in ['READY', 'RECOVERY_READY', 'NOT_READY']
      when: vless_agent_can_rollback
      no_log: true

    - name: Fail deployment after successful compatible rollback
      ansible.builtin.fail:
        msg: Requested revision failed; the declared compatible previous SHA was restored and verified
      when: vless_agent_can_rollback
