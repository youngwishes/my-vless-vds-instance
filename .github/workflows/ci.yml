name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Derive checked-out candidate SHA
        id: candidate
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.9.21"
          enable-cache: false

      - name: Install the exact locked environment
        run: uv sync --locked --all-groups

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Validate production Compose
        env:
          AGENT_SHA: ${{ steps.candidate.outputs.sha }}
          AGENT_TOKEN_CURRENT: ci-dummy-token-not-a-credential-0001
          REALITY_PRIVATE_KEY_FILE: /tmp/ci-dummy-reality-private-key
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate local Compose
        env:
          AGENT_TOKEN_CURRENT: ci-dummy-token-not-a-credential-0001
          REALITY_PRIVATE_KEY_FILE: /tmp/ci-dummy-reality-private-key
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Syntax-check test deployment
        run: >-
          uv run ansible-playbook -i deploy/inventory.example.ini
          deploy/playbook-test.yml --syntax-check
          -e deploy_revision="${{ steps.candidate.outputs.sha }}"

      - name: Syntax-check production deployment
        run: >-
          uv run ansible-playbook -i deploy/inventory.example.ini
          deploy/playbook-prod.yml --syntax-check
          -e deploy_revision="${{ steps.candidate.outputs.sha }}"

      - name: Run deployment safety tests
        run: uv run pytest deploy/tests -q

      - name: Run complete test suite
        run: uv run pytest -q
