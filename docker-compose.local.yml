services:
  runtime-volume-init:
    build:
      context: .
    user: "0:0"
    command: ["sh", "-c", "chown 65532:65532 /generated && chown 999:999 /var/lib/vless-agent"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    read_only: true
    restart: "no"
    security_opt: [no-new-privileges:true]
    volumes:
      - xray-config:/generated
      - agent-snapshot:/var/lib/vless-agent

  xray-config:
    build:
      context: .
    user: "65532:65532"
    command: ["/app/entrypoint.sh"]
    cap_drop: [ALL]
    depends_on:
      runtime-volume-init:
        condition: service_completed_successfully
    environment:
      REALITY_PRIVATE_KEY_FILE: /run/secrets/reality_private_key
      REALITY_TARGET: ${REALITY_TARGET:-}
      REALITY_SERVER_NAME: ${REALITY_SERVER_NAME:-}
      REALITY_SHORT_IDS: ${REALITY_SHORT_IDS:-}
      VLESS_PUBLIC_PORT: ${VLESS_PUBLIC_PORT:-8443}
      XRAY_MANAGEMENT_IP: 172.31.255.2
      XRAY_CONFIG_OUTPUT: /generated/config.json
    read_only: true
    restart: "no"
    security_opt: [no-new-privileges:true]
    secrets:
      - source: reality_private_key
        target: reality_private_key
    tmpfs: [/tmp]
    volumes: [xray-config:/generated]

  xray:
    image: ghcr.io/xtls/xray-core@sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f
    user: "65532:65532"
    cap_drop: [ALL]
    depends_on:
      xray-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "api", "lsi", "--server=172.31.255.2:10085", "--timeout=3", "--isOnlyTags=true"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks:
      management:
        ipv4_address: 172.31.255.2
      public: {}
    ports: ["${VLESS_PUBLIC_PORT:-8443}:${VLESS_PUBLIC_PORT:-8443}/tcp"]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes: [xray-config:/usr/local/etc/xray:ro]

  agent:
    build:
      context: .
    user: agent
    command: ["uvicorn", "src.app:create_app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    cap_drop: [ALL]
    depends_on:
      runtime-volume-init:
        condition: service_completed_successfully
      xray:
        condition: service_healthy
    environment:
      AGENT_TOKEN_CURRENT: ${AGENT_TOKEN_CURRENT:?AGENT_TOKEN_CURRENT must be set}
      AGENT_TOKEN_NEXT:
      ENVIRONMENT_MODE: local
      VLESS_NODE_ID: ${VLESS_NODE_ID:-local-node}
      AGENT_SHA: ${AGENT_SHA:-0000000000000000000000000000000000000000}
      XRAY_VERSION: "26.7.11"
      XRAY_IMAGE_DIGEST: sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f
      XRAY_API_TARGET: 172.31.255.2:10085
      XRAY_API_TIMEOUT_SECONDS: ${XRAY_API_TIMEOUT_SECONDS:-5}
      XRAY_MANAGED_INBOUND_TAG: vless-managed
      SNAPSHOT_PATH: /tmp/vless-agent/snapshot.json
    networks: [management]
    ports: ["127.0.0.1:${VLESS_AGENT_PORT:-8000}:8000"]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./src:/app/src:ro
      - agent-snapshot:/tmp/vless-agent

networks:
  management:
    internal: true
    ipam:
      config:
        - subnet: 172.31.255.0/28
  public:

volumes:
  agent-snapshot:
  xray-config:

secrets:
  reality_private_key:
    file: ${REALITY_PRIVATE_KEY_FILE:?REALITY_PRIVATE_KEY_FILE must point to the runtime secret file}
